<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="100%" height="100%">
  <defs>
    <radialGradient id="umb-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#181c24" />
      <stop offset="60%" stop-color="#0e1014" />
      <stop offset="100%" stop-color="#060708" />
    </radialGradient>
    <linearGradient id="panel-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c323f" />
      <stop offset="30%" stop-color="#191c23" />
      <stop offset="70%" stop-color="#0e1014" />
      <stop offset="100%" stop-color="#14171d" />
    </linearGradient>
    <filter id="umb-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#000" flood-opacity="0.85" />
    </filter>
  </defs>

  <rect width="900" height="800" fill="url(#umb-bg)" />
  <ellipse cx="450" cy="720" rx="360" ry="45" fill="#84cc16" opacity="0.06" />

  <g transform="translate(60, 40)" filter="url(#umb-shadow)">
    <!-- Central Umbrella Tip (Ferrule) -->
    <path d="M 305 60 L 320 20 L 335 60 Z" fill="#0d0f12" stroke="#2a303b" stroke-width="1.5" />

    <!-- Canopy Panels (Arcing across from left to right) -->
    <!-- Leftmost panel -->
    <path d="M 320 60 C 220 180 120 400 20 620 C 60 600 120 590 160 580 C 200 420 270 240 320 60 Z" fill="#12151b" stroke="#090a0d" stroke-width="2" />
    <!-- Center-left panel (Facing forward) -->
    <path d="M 320 60 C 270 240 200 420 160 580 C 260 560 380 570 480 610 C 440 400 370 200 320 60 Z" fill="url(#panel-base)" stroke="#090a0d" stroke-width="2" />
    <!-- Center-right panel -->
    <path d="M 320 60 C 370 200 440 400 480 610 C 580 590 680 530 740 450 C 620 300 470 150 320 60 Z" fill="#161920" stroke="#090a0d" stroke-width="2" />
    <!-- Rightmost panel -->
    <path d="M 320 60 C 470 150 620 300 740 450 C 760 410 780 340 760 300 C 620 180 470 90 320 60 Z" fill="#0d0f13" stroke="#090a0d" stroke-width="2" />

    <!-- Rib End Caps (Tips) -->
    <circle cx="20" cy="620" r="4" fill="#050608" />
    <circle cx="160" cy="580" r="5" fill="#050608" />
    <circle cx="480" cy="610" r="5" fill="#050608" />
    <circle cx="740" cy="450" r="4" fill="#050608" />

    <!-- Shaft coming down from canopy center to handle -->
    <line x1="390" y1="480" x2="520" y2="670" stroke="#0b0c0f" stroke-width="12" stroke-linecap="round" />
    <!-- Handle (Curved Ergonomic Soft Grip) -->
    <path d="M 520 670 L 550 710 C 570 740 550 770 510 770 C 480 770 470 750 480 730" fill="none" stroke="#16181f" stroke-width="22" stroke-linecap="round" />
    <!-- Grip grooves -->
    <line x1="525" y1="680" x2="538" y2="698" stroke="#323846" stroke-width="3" />
    <line x1="535" y1="695" x2="548" y2="713" stroke="#323846" stroke-width="3" />

    <!-- Main Front Panel DRS Logo (Large Centered) -->
    <g transform="translate(200, 240) rotate(14) scale(0.65)">
      <path d="M 30 50 L 55 25 L 345 25 L 370 50 L 370 125 L 345 150 L 55 150 L 30 125 Z"
            fill="none" stroke="#84cc16" stroke-width="10" stroke-linejoin="round" />
      <line x1="8" y1="87" x2="30" y2="87" stroke="#84cc16" stroke-width="10" />
      <line x1="370" y1="87" x2="392" y2="87" stroke="#84cc16" stroke-width="10" />

      <text x="60" y="112" font-family="'Impact', Arial Black, sans-serif" font-size="96" font-style="italic" fill="#a3e635">D</text>
      <text x="155" y="112" font-family="'Impact', Arial Black, sans-serif" font-size="96" font-style="italic" fill="#ec4899">R</text>
      <text x="250" y="112" font-family="'Impact', Arial Black, sans-serif" font-size="96" font-style="italic" fill="#a3e635">S</text>

      <text x="200" y="185" font-family="Arial, sans-serif" font-size="22" font-weight="900" font-style="italic" fill="#84cc16" text-anchor="middle" letter-spacing="3">DAILY RIDE SOUTH</text>
      <line x1="45" y1="200" x2="355" y2="200" stroke="#84cc16" stroke-width="5" />
    </g>

    <!-- Side Panel DRS Logo (Smaller, angled perspective) -->
    <g transform="translate(48, 480) rotate(-18) scale(0.28)">
      <path d="M 30 50 L 55 25 L 345 25 L 370 50 L 370 125 L 345 150 L 55 150 L 30 125 Z" fill="none" stroke="#84cc16" stroke-width="10" />
      <text x="60" y="112" font-family="'Impact', Arial Black, sans-serif" font-size="96" font-style="italic" fill="#a3e635">D</text>
      <text x="155" y="112" font-family="'Impact', Arial Black, sans-serif" font-size="96" font-style="italic" fill="#ec4899">R</text>
      <text x="250" y="112" font-family="'Impact', Arial Black, sans-serif" font-size="96" font-style="italic" fill="#a3e635">S</text>
      <text x="200" y="185" font-family="Arial, sans-serif" font-size="22" font-weight="900" font-style="italic" fill="#84cc16" text-anchor="middle">DAILY RIDE SOUTH</text>
    </g>

    <!-- Right Panel DRS Logo (Perspective) -->
    <g transform="translate(560, 150) rotate(32) scale(0.25)">
      <path d="M 30 50 L 55 25 L 345 25 L 370 50 L 370 125 L 345 150 L 55 150 L 30 125 Z" fill="none" stroke="#84cc16" stroke-width="10" />
      <text x="60" y="112" font-family="'Impact', Arial Black, sans-serif" font-size="96" font-style="italic" fill="#a3e635">D</text>
      <text x="155" y="112" font-family="'Impact', Arial Black, sans-serif" font-size="96" font-style="italic" fill="#ec4899">R</text>
      <text x="250" y="112" font-family="'Impact', Arial Black, sans-serif" font-size="96" font-style="italic" fill="#a3e635">S</text>
      <text x="200" y="185" font-family="Arial, sans-serif" font-size="22" font-weight="900" font-style="italic" fill="#84cc16" text-anchor="middle">DAILY RIDE SOUTH</text>
    </g>
  </g>
</svg>
