<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="cushion-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#181c24" />
      <stop offset="60%" stop-color="#0e1014" />
      <stop offset="100%" stop-color="#060708" />
    </radialGradient>
    <radialGradient id="fabric-pillow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#282d38" />
      <stop offset="40%" stop-color="#191c22" />
      <stop offset="80%" stop-color="#0e1014" />
      <stop offset="100%" stop-color="#07080a" />
    </radialGradient>
    <filter id="cushion-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#000" flood-opacity="0.9" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#cushion-bg)" />
  <ellipse cx="400" cy="710" rx="300" ry="45" fill="#84cc16" opacity="0.06" />

  <!-- Cushion Body -->
  <g transform="translate(140, 140)" filter="url(#cushion-shadow)">
    <!-- Plush Pillow Shape with corner tufts -->
    <path d="M 60 40
             C 180 15 340 15 460 40
             C 495 50 510 80 500 120
             C 525 240 525 320 500 420
             C 510 460 495 485 460 495
             C 340 520 180 520 60 495
             C 25 485 10 460 20 420
             C -5 320 -5 240 20 120
             C 10 80 25 50 60 40 Z"
          fill="url(#fabric-pillow)" stroke="#222630" stroke-width="2" />

    <!-- Corner creasing lines -->
    <path d="M 60 40 Q 120 100 180 140" stroke="#08090b" stroke-width="3" fill="none" opacity="0.7" />
    <path d="M 460 40 Q 400 100 340 140" stroke="#08090b" stroke-width="3" fill="none" opacity="0.7" />
    <path d="M 60 495 Q 120 435 180 395" stroke="#08090b" stroke-width="3" fill="none" opacity="0.7" />
    <path d="M 460 495 Q 400 435 340 395" stroke="#08090b" stroke-width="3" fill="none" opacity="0.7" />

    <!-- Piping edge seam -->
    <path d="M 60 40
             C 180 15 340 15 460 40
             C 495 50 510 80 500 120
             C 525 240 525 320 500 420
             C 510 460 495 485 460 495
             C 340 520 180 520 60 495
             C 25 485 10 460 20 420
             C -5 320 -5 240 20 120
             C 10 80 25 50 60 40 Z"
          fill="none" stroke="#2e3442" stroke-width="3" opacity="0.5" />

    <!-- Centered Large DRS Graphic -->
    <g transform="translate(70, 165) scale(0.95)">
      <!-- Outer Frame -->
      <path d="M 35 60 L 70 25 L 330 25 L 365 60 L 365 145 L 330 180 L 70 180 L 35 145 Z"
            fill="none" stroke="#84cc16" stroke-width="12" stroke-linejoin="round" />
      <line x1="10" y1="102" x2="35" y2="102" stroke="#84cc16" stroke-width="12" />
      <line x1="365" y1="102" x2="390" y2="102" stroke="#84cc16" stroke-width="12" />

      <!-- DRS Letters -->
      <text x="60" y="135" font-family="'Impact', Arial Black, sans-serif" font-size="115" font-style="italic" fill="#a3e635">D</text>
      <text x="155" y="135" font-family="'Impact', Arial Black, sans-serif" font-size="115" font-style="italic" fill="#ec4899">R</text>
      <text x="250" y="135" font-family="'Impact', Arial Black, sans-serif" font-size="115" font-style="italic" fill="#a3e635">S</text>

      <!-- Underline & Title -->
      <text x="200" y="220" font-family="Arial, sans-serif" font-size="24" font-weight="900" font-style="italic" fill="#84cc16" text-anchor="middle" letter-spacing="3">DAILY RIDE SOUTH</text>
      <line x1="45" y1="235" x2="355" y2="235" stroke="#84cc16" stroke-width="5" />
    </g>
  </g>
</svg>
