<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="100%" height="100%">
  <defs>
    <radialGradient id="hat-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#181c24" />
      <stop offset="60%" stop-color="#0e1014" />
      <stop offset="100%" stop-color="#060708" />
    </radialGradient>
    <linearGradient id="twill-fabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22262f" />
      <stop offset="40%" stop-color="#14171d" />
      <stop offset="80%" stop-color="#0a0c0f" />
      <stop offset="100%" stop-color="#181c23" />
    </linearGradient>
    <filter id="hat-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#000" flood-opacity="0.9" />
    </filter>
  </defs>

  <rect width="800" height="700" fill="url(#hat-bg)" />
  <ellipse cx="400" cy="590" rx="320" ry="50" fill="#84cc16" opacity="0.06" />

  <g transform="translate(100, 100)" filter="url(#hat-shadow)">
    <!-- Downward Sloping Brim -->
    <path d="M 0 350
             C 10 330 80 300 120 280
             C 240 250 360 250 480 280
             C 520 300 590 330 600 350
             C 550 460 380 500 300 500
             C 220 500 50 460 0 350 Z"
          fill="url(#twill-fabric)" stroke="#111317" stroke-width="2" />

    <!-- Brim stitch concentric rings -->
    <path d="M 40 370 C 120 440 240 465 300 465 C 360 465 480 440 560 370" fill="none" stroke="#2c323e" stroke-width="1.5" />
    <path d="M 25 360 C 110 430 230 450 300 450 C 370 450 490 430 575 360" fill="none" stroke="#2c323e" stroke-width="1.5" />
    <path d="M 12 350 C 100 415 220 435 300 435 C 380 435 500 415 588 350" fill="none" stroke="#2c323e" stroke-width="1.5" />

    <!-- Crown Cylinder (Side Wall) -->
    <path d="M 120 280
             L 155 70
             C 210 50 390 50 445 70
             L 480 280
             C 380 260 220 260 120 280 Z"
          fill="url(#twill-fabric)" stroke="#1a1e26" stroke-width="2" />

    <!-- Crown Top Seam -->
    <ellipse cx="300" cy="70" rx="145" ry="35" fill="#1b1f27" stroke="#2c3340" stroke-width="2" />

    <!-- Metal ventilation eyelets on crown -->
    <circle cx="205" cy="160" r="6" fill="#0b0d10" stroke="#4a5568" stroke-width="2" />
    <circle cx="395" cy="160" r="6" fill="#0b0d10" stroke="#4a5568" stroke-width="2" />

    <!-- Front Embroidered DRS Logo -->
    <g transform="translate(165, 120) scale(0.68)">
      <!-- Outer Frame -->
      <path d="M 30 50 L 55 25 L 345 25 L 370 50 L 370 125 L 345 150 L 55 150 L 30 125 Z"
            fill="none" stroke="#84cc16" stroke-width="10" stroke-linejoin="round" />
      <line x1="8" y1="87" x2="30" y2="87" stroke="#84cc16" stroke-width="10" />
      <line x1="370" y1="87" x2="392" y2="87" stroke="#84cc16" stroke-width="10" />

      <!-- DRS Letters -->
      <text x="60" y="112" font-family="'Impact', Arial Black, sans-serif" font-size="96" font-style="italic" fill="#a3e635">D</text>
      <text x="155" y="112" font-family="'Impact', Arial Black, sans-serif" font-size="96" font-style="italic" fill="#ec4899">R</text>
      <text x="250" y="112" font-family="'Impact', Arial Black, sans-serif" font-size="96" font-style="italic" fill="#a3e635">S</text>

      <!-- Underline & Title -->
      <text x="200" y="185" font-family="Arial, sans-serif" font-size="22" font-weight="900" font-style="italic" fill="#84cc16" text-anchor="middle" letter-spacing="3">DAILY RIDE SOUTH</text>
      <line x1="45" y1="200" x2="355" y2="200" stroke="#84cc16" stroke-width="5" />
    </g>
  </g>
</svg>
