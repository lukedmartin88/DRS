<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="b1-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1b2029" />
      <stop offset="60%" stop-color="#0f1115" />
      <stop offset="100%" stop-color="#060708" />
    </radialGradient>
    <filter id="b1-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000" flood-opacity="0.85" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#b1-bg)" />
  <ellipse cx="400" cy="510" rx="340" ry="45" fill="#84cc16" opacity="0.08" />

  <!-- Badge banner: BUNDLE 1 -->
  <g transform="translate(40, 40)">
    <rect width="210" height="42" rx="10" fill="#dc2626" />
    <text x="105" y="27" font-family="'Impact', Arial Black, sans-serif" font-size="22" font-style="italic" fill="#ffffff" text-anchor="middle" letter-spacing="1">BUNDLE 1 • £40</text>
  </g>
  <g transform="translate(620, 40)">
    <rect width="140" height="42" rx="10" fill="#84cc16" />
    <text x="70" y="27" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#000" text-anchor="middle">SAVE £10</text>
  </g>

  <!-- Left: T-Shirt Silhouette -->
  <g transform="translate(80, 110) scale(0.68)" filter="url(#b1-shadow)">
    <path d="M 120 40 L 40 100 L 90 190 L 140 160 L 140 460 L 360 460 L 360 160 L 410 190 L 460 100 L 380 40 C 330 75 170 75 120 40 Z" fill="#14171d" stroke="#2c3340" stroke-width="2.5" />
    <!-- T-Shirt DRS Logo -->
    <g transform="translate(160, 150) scale(0.48)">
      <path d="M 25 45 L 45 25 L 260 25 L 280 45 L 280 115 L 260 135 L 45 135 L 25 115 Z" fill="none" stroke="#84cc16" stroke-width="8" />
      <text x="45" y="100" font-family="'Impact', Arial Black, sans-serif" font-size="76" font-style="italic" fill="#a3e635">D</text>
      <text x="110" y="100" font-family="'Impact', Arial Black, sans-serif" font-size="76" font-style="italic" fill="#ec4899">R</text>
      <text x="175" y="100" font-family="'Impact', Arial Black, sans-serif" font-size="76" font-style="italic" fill="#a3e635">S</text>
      <text x="150" y="160" font-family="Arial, sans-serif" font-size="18" font-weight="900" font-style="italic" fill="#84cc16" text-anchor="middle">DAILY RIDE SOUTH</text>
    </g>
    <text x="250" y="430" font-family="'Impact', Arial, sans-serif" font-size="28" fill="#a1a1aa" text-anchor="middle">DRS T-SHIRT</text>
  </g>

  <!-- Plus Symbol -->
  <g transform="translate(380, 270)">
    <circle cx="20" cy="20" r="28" fill="#1f242d" stroke="#84cc16" stroke-width="2" />
    <text x="20" y="29" font-family="'Impact', Arial Black, sans-serif" font-size="32" fill="#84cc16" text-anchor="middle">+</text>
  </g>

  <!-- Right: Hoodie Silhouette -->
  <g transform="translate(420, 100) scale(0.68)" filter="url(#b1-shadow)">
    <!-- Hood -->
    <path d="M 160 50 C 180 15 320 15 340 50 C 370 90 360 130 340 140 C 310 130 190 130 160 140 C 140 130 130 90 160 50 Z" fill="#0d0f12" />
    <!-- Body -->
    <path d="M 150 110 L 40 190 L 80 280 L 140 240 L 140 490 L 360 490 L 360 240 L 420 280 L 460 190 L 350 110 Z" fill="#191d24" stroke="#333a48" stroke-width="2.5" />
    <!-- Kangaroo pocket -->
    <path d="M 170 380 L 330 380 L 310 470 L 190 470 Z" fill="#11141a" stroke="#252b36" stroke-width="2" />
    <!-- Hoodie DRS Logo -->
    <g transform="translate(160, 170) scale(0.48)">
      <path d="M 25 45 L 45 25 L 260 25 L 280 45 L 280 115 L 260 135 L 45 135 L 25 115 Z" fill="none" stroke="#84cc16" stroke-width="8" />
      <text x="45" y="100" font-family="'Impact', Arial Black, sans-serif" font-size="76" font-style="italic" fill="#a3e635">D</text>
      <text x="110" y="100" font-family="'Impact', Arial Black, sans-serif" font-size="76" font-style="italic" fill="#ec4899">R</text>
      <text x="175" y="100" font-family="'Impact', Arial Black, sans-serif" font-size="76" font-style="italic" fill="#a3e635">S</text>
      <text x="150" y="160" font-family="Arial, sans-serif" font-size="18" font-weight="900" font-style="italic" fill="#84cc16" text-anchor="middle">DAILY RIDE SOUTH</text>
    </g>
    <text x="250" y="525" font-family="'Impact', Arial, sans-serif" font-size="28" fill="#a1a1aa" text-anchor="middle">DRS HOODIE</text>
  </g>
</svg>
