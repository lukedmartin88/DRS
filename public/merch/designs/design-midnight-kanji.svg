<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="jdm-bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="70%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="red-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="red-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ef4444" flood-opacity="0.8" />
    </filter>
  </defs>

  <rect width="600" height="600" rx="32" fill="url(#jdm-bg)" />
  <rect x="8" y="8" width="584" height="584" rx="26" fill="none" stroke="#27272a" stroke-width="2" />

  <!-- Japanese Rising Sun subtle rays -->
  <g stroke="#27272a" stroke-width="1.5" opacity="0.3">
    <line x1="300" y1="230" x2="100" y2="40" />
    <line x1="300" y1="230" x2="200" y2="20" />
    <line x1="300" y1="230" x2="300" y2="10" />
    <line x1="300" y1="230" x2="400" y2="20" />
    <line x1="300" y1="230" x2="500" y2="40" />
  </g>

  <!-- Big Red Kanji Seal / Disc -->
  <circle cx="300" cy="220" r="95" fill="url(#red-accent)" filter="url(#red-glow)" />

  <!-- Center Katakana / Kanji Text for Daily Ride South (南走行部) -->
  <text x="300" y="240" fill="#ffffff" font-family="sans-serif" font-size="52" font-weight="900" text-anchor="middle" letter-spacing="4">
    デイリー
  </text>
  <text x="300" y="300" fill="#a1a1aa" font-family="sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="8">
    南 走 行 部
  </text>

  <!-- Dual side Japanese badge seals -->
  <rect x="130" y="160" width="30" height="120" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />
  <text x="145" y="200" fill="#ef4444" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle">速</text>
  <text x="145" y="230" fill="#ef4444" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle">度</text>
  <text x="145" y="260" fill="#ef4444" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle">魂</text>

  <rect x="440" y="160" width="30" height="120" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />
  <text x="455" y="200" fill="#ef4444" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle">峠</text>
  <text x="455" y="230" fill="#ef4444" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle">攻</text>
  <text x="455" y="260" fill="#ef4444" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle">撃</text>

  <!-- Typography -->
  <g text-anchor="middle">
    <text x="300" y="75" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" letter-spacing="6">
      JDM STREET DIVISION
    </text>
    <text x="300" y="430" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" font-style="italic" letter-spacing="3">
      MIDNIGHT TOKYO
    </text>
    <rect x="180" y="455" width="240" height="26" rx="5" fill="#ef4444" />
    <text x="300" y="472" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" letter-spacing="4">
      DAILY RIDE SOUTH JAPAN
    </text>
    <text x="300" y="525" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="2">
      KANJI TOUGE RACER • VARIATION #03
    </text>
  </g>
</svg>
