<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="track-bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <filter id="track-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.8" />
    </filter>
  </defs>

  <rect width="600" height="600" rx="32" fill="url(#track-bg)" />
  <rect x="8" y="8" width="584" height="584" rx="26" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Diagonal checkered racing band -->
  <g transform="translate(300, 220) rotate(-15) translate(-300, -220)">
    <rect x="50" y="160" width="500" height="60" fill="#0284c7" opacity="0.3" />
    <g fill="#38bdf8">
      <polygon points="100,160 140,160 110,220 70,220" />
      <polygon points="180,160 220,160 190,220 150,220" />
      <polygon points="260,160 300,160 270,220 230,220" />
      <polygon points="340,160 380,160 350,220 310,220" />
      <polygon points="420,160 460,160 430,220 390,220" />
      <polygon points="500,160 540,160 510,220 470,220" />
    </g>
  </g>

  <!-- Aerodynamic front splitter / circuit badge -->
  <g transform="translate(190, 140)">
    <!-- Circuit layout loop -->
    <path d="M 60 50 L 160 50 C 200 50 210 90 190 120 L 140 180 C 120 200 90 200 60 170 L 40 130 C 20 90 20 50 60 50 Z" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linejoin="round" filter="url(#track-glow)" />
    <!-- Start finish flags -->
    <circle cx="60" cy="50" r="10" fill="#facc15" />
    <text x="110" y="130" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="900" font-style="italic">01</text>
  </g>

  <!-- Typography -->
  <g text-anchor="middle">
    <text x="300" y="75" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" letter-spacing="6">
      CIRCUIT &amp; TIME ATTACK
    </text>
    <text x="300" y="430" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" font-style="italic" letter-spacing="2">
      APEX HUNTER
    </text>
    <rect x="180" y="455" width="240" height="26" rx="5" fill="#facc15" />
    <text x="300" y="472" fill="#000000" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" letter-spacing="4">
      RACE SPEC • TRACKDAY
    </text>
    <text x="300" y="525" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="2">
      TIME ATTACK SPECIAL • VARIATION #04
    </text>
  </g>
</svg>
