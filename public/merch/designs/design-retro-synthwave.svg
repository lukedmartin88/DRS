<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="synth-sky" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2a0845" />
      <stop offset="60%" stop-color="#150524" />
      <stop offset="100%" stop-color="#07020d" />
    </radialGradient>
    <linearGradient id="sun-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="40%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="synth-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#f43f5e" flood-opacity="0.8" />
    </filter>
  </defs>

  <rect width="600" height="600" rx="32" fill="url(#synth-sky)" />
  <rect x="8" y="8" width="584" height="584" rx="26" fill="none" stroke="#3b0764" stroke-width="2" />

  <!-- Outrun Sun -->
  <g filter="url(#synth-glow)">
    <circle cx="300" cy="220" r="110" fill="url(#sun-grad)" />
    <!-- Sun scanlines -->
    <rect x="180" y="240" width="240" height="6" fill="#150524" />
    <rect x="180" y="258" width="240" height="10" fill="#150524" />
    <rect x="180" y="280" width="240" height="15" fill="#150524" />
    <rect x="180" y="306" width="240" height="22" fill="#150524" />
  </g>

  <!-- Perspective 3D Grid -->
  <g stroke="#06b6d4" stroke-width="1.5" opacity="0.6">
    <line x1="300" y1="330" x2="300" y2="580" stroke-width="2.5" />
    <line x1="300" y1="330" x2="160" y2="580" stroke-width="2" />
    <line x1="300" y1="330" x2="440" y2="580" stroke-width="2" />
    <line x1="300" y1="330" x2="20" y2="580" stroke-width="2" />
    <line x1="300" y1="330" x2="580" y2="580" stroke-width="2" />
    <!-- Horizontals with perspective spacing -->
    <line x1="260" y1="350" x2="340" y2="350" />
    <line x1="220" y1="380" x2="380" y2="380" />
    <line x1="170" y1="420" x2="430" y2="420" />
    <line x1="100" y1="480" x2="500" y2="480" />
    <line x1="20" y1="560" x2="580" y2="560" />
  </g>

  <!-- Sports Hatch Car Silhouette -->
  <g fill="#0f172a" stroke="#f43f5e" stroke-width="3">
    <!-- Body Profile -->
    <path d="M 170 345 
             L 210 320 
             L 270 295 
             L 370 295 
             L 420 330 
             L 440 335 
             L 445 355 
             L 415 355
             C 415 340 395 340 395 355
             L 245 355
             C 245 340 225 340 225 355
             L 165 355
             Z" />
    <!-- Rear Wing -->
    <path d="M 160 330 L 195 330 L 190 335 L 160 335 Z" fill="#06b6d4" stroke="none" />
    <!-- Wheels -->
    <circle cx="235" cy="355" r="14" fill="#06b6d4" stroke="#ffffff" stroke-width="2" />
    <circle cx="405" cy="355" r="14" fill="#06b6d4" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- Typography -->
  <g text-anchor="middle">
    <text x="300" y="75" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" letter-spacing="6">
      RETRO WAVE EDITION
    </text>
    <text x="300" y="440" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" font-style="italic" letter-spacing="3">
      SYNTHWAVE SUNSET
    </text>
    <rect x="200" y="465" width="200" height="26" rx="5" fill="#06b6d4" />
    <text x="300" y="482" fill="#000000" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" letter-spacing="4">
      DAILY RIDE SOUTH
    </text>
    <text x="300" y="525" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="2">
      80S RADICAL STREET • VARIATION #02
    </text>
  </g>
</svg>
