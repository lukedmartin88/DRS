<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="neon-bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#141a24" />
      <stop offset="70%" stop-color="#0a0d12" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>
    <filter id="glow-lime" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#84cc16" flood-opacity="0.8" />
    </filter>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ec4899" flood-opacity="0.8" />
    </filter>
    <linearGradient id="grad-racing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <rect width="600" height="600" rx="32" fill="url(#neon-bg)" />
  <rect x="8" y="8" width="584" height="584" rx="26" fill="none" stroke="#27272a" stroke-width="2" />

  <!-- Speed Lines Background -->
  <g stroke="#27272a" stroke-width="1.5" stroke-dasharray="10 15" opacity="0.4">
    <line x1="50" y1="120" x2="550" y2="120" />
    <line x1="30" y1="200" x2="570" y2="200" />
    <line x1="70" y1="420" x2="530" y2="420" />
    <line x1="40" y1="490" x2="560" y2="490" />
  </g>

  <!-- Turbo Charger Silhouette Graphic -->
  <g transform="translate(180, 110) scale(0.8)">
    <!-- Scroll housing -->
    <path d="M 150 50 C 240 50 280 120 280 200 C 280 280 220 340 140 340 C 70 340 30 280 30 200 C 30 140 70 100 120 90 L 120 30 L 190 30 L 190 60" fill="none" stroke="#84cc16" stroke-width="14" stroke-linecap="round" filter="url(#glow-lime)" />
    <!-- Compressor Wheel -->
    <circle cx="150" cy="200" r="60" fill="#18181b" stroke="#ec4899" stroke-width="8" filter="url(#glow-pink)" />
    <circle cx="150" cy="200" r="16" fill="#84cc16" />
    <!-- Turbine blades -->
    <g stroke="#ec4899" stroke-width="5" stroke-linecap="round">
      <line x1="150" y1="150" x2="150" y2="175" />
      <line x1="150" y1="225" x2="150" y2="250" />
      <line x1="100" y1="200" x2="125" y2="200" />
      <line x1="175" y1="200" x2="200" y2="200" />
      <line x1="115" y1="165" x2="132" y2="182" />
      <line x1="168" y1="218" x2="185" y2="235" />
      <line x1="115" y1="235" x2="132" y2="218" />
      <line x1="168" y1="182" x2="185" y2="165" />
    </g>
  </g>

  <!-- Badging & Typography -->
  <g text-anchor="middle">
    <!-- Top Subtitle -->
    <text x="300" y="80" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" letter-spacing="8">
      DRS BOOST DIVISION
    </text>

    <!-- Main Title -->
    <text x="300" y="440" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" font-style="italic" letter-spacing="2">
      NEON ST DRIFT
    </text>

    <!-- Subtitle banner -->
    <rect x="180" y="465" width="240" height="28" rx="6" fill="#84cc16" />
    <text x="300" y="484" fill="#000000" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" letter-spacing="4">
      HIGH BOOST EDITION
    </text>

    <!-- Specs text -->
    <text x="300" y="530" fill="#ec4899" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="3">
      LIMITED RUN • GALLERY VARIATION #01
    </text>
  </g>
</svg>
