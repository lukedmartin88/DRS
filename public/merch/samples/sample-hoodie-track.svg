<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="sample-bg-4" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#141820" />
      <stop offset="60%" stop-color="#0b0e14" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>
    <linearGradient id="hoodie-grad-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222732" />
      <stop offset="40%" stop-color="#141720" />
      <stop offset="80%" stop-color="#0b0d13" />
      <stop offset="100%" stop-color="#181c26" />
    </linearGradient>
    <filter id="track-yellow-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#eab308" flood-opacity="0.8" />
    </filter>
    <filter id="sample-drop-4" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000" flood-opacity="0.85" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#sample-bg-4)" />
  <ellipse cx="400" cy="740" rx="300" ry="60" fill="#eab308" opacity="0.08" />

  <!-- HOODIE BODY -->
  <g transform="translate(100, 30)" filter="url(#sample-drop-4)">
    <path d="M 180 80 C 120 90 40 160 0 280 C -5 295 10 320 30 310 C 70 270 100 230 115 210 L 110 630 C 110 655 140 665 180 665 L 420 665 C 460 665 490 655 490 630 L 485 210 C 500 230 530 270 570 310 C 590 320 605 295 600 280 C 560 160 480 90 420 80 Z" fill="url(#hoodie-grad-4)" />
    
    <!-- Hood -->
    <path d="M 180 80 C 170 30 220 10 300 10 C 380 10 430 30 420 80 C 410 135 370 155 300 155 C 230 155 190 135 180 80 Z" fill="#141720" stroke="#0b0d13" stroke-width="2" />
    
    <!-- MAIN BACK PRINT: DESIRED DESIGN (Track Attack / Apex Hunter) -->
    <g transform="translate(140, 210)">
      <rect width="320" height="340" rx="16" fill="#0d1017" stroke="#27272a" stroke-width="2" opacity="0.95" />
      
      <!-- Checkered Bands -->
      <g fill="#eab308" opacity="0.85">
        <rect x="50" y="50" width="220" height="8" rx="2" />
        <rect x="50" y="65" width="22" height="12" />
        <rect x="94" y="65" width="22" height="12" />
        <rect x="138" y="65" width="22" height="12" />
        <rect x="182" y="65" width="22" height="12" />
        <rect x="226" y="65" width="22" height="12" />
        <rect x="72" y="77" width="22" height="12" fill="#ffffff" />
        <rect x="116" y="77" width="22" height="12" fill="#ffffff" />
        <rect x="160" y="77" width="22" height="12" fill="#ffffff" />
        <rect x="204" y="77" width="22" height="12" fill="#ffffff" />
        <rect x="248" y="77" width="22" height="12" fill="#ffffff" />
      </g>
      
      <!-- Apex Curve graphic -->
      <path d="M 60 210 Q 160 110 260 170" fill="none" stroke="#eab308" stroke-width="6" stroke-linecap="round" filter="url(#track-yellow-glow)" />
      <path d="M 80 225 Q 160 135 240 185" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />
      
      <text x="160" y="240" fill="#ffffff" font-family="'Montserrat', sans-serif" font-weight="900" font-size="20" text-anchor="middle" letter-spacing="3">TRACK ATTACK</text>
      <text x="160" y="260" fill="#eab308" font-family="'Montserrat', sans-serif" font-weight="700" font-size="10" text-anchor="middle" letter-spacing="4">APEX HUNTER EDITION</text>
      
      <!-- INTEGRATED DRS CLUB LOGO IN THE PRINT -->
      <g transform="translate(60, 285)">
        <rect width="200" height="36" rx="8" fill="#000000" stroke="#eab308" stroke-width="1.5" />
        <circle cx="24" cy="18" r="10" fill="#eab308" />
        <text x="24" y="22" fill="#000000" font-family="'Montserrat', sans-serif" font-weight="900" font-size="10" text-anchor="middle">DRS</text>
        <text x="44" y="22" fill="#ffffff" font-family="'Montserrat', sans-serif" font-weight="900" font-size="11" letter-spacing="1">DAILY RIDE SOUTH</text>
        <text x="165" y="22" fill="#eab308" font-family="'Montserrat', sans-serif" font-weight="800" font-size="8">CLUB</text>
      </g>
    </g>

    <!-- CHEST DRS BADGE -->
    <g transform="translate(145, 120)">
      <circle cx="25" cy="25" r="24" fill="#0b0d13" stroke="#eab308" stroke-width="2" filter="url(#track-yellow-glow)" />
      <text x="25" y="28" fill="#eab308" font-family="'Montserrat', sans-serif" font-weight="900" font-size="12" text-anchor="middle" letter-spacing="1">DRS</text>
      <text x="25" y="38" fill="#ffffff" font-family="'Montserrat', sans-serif" font-weight="700" font-size="6" text-anchor="middle" letter-spacing="0.5">TRACK</text>
    </g>
  </g>

  <!-- SAMPLE BADGE OVERLAY -->
  <g transform="translate(40, 40)">
    <rect width="230" height="52" rx="14" fill="#000000" fill-opacity="0.85" stroke="#eab308" stroke-width="1.5" />
    <text x="18" y="23" fill="#eab308" font-family="'Montserrat', sans-serif" font-weight="900" font-size="12" letter-spacing="1">CUSTOM PRINT SAMPLE</text>
    <text x="18" y="41" fill="#a1a1aa" font-family="'Montserrat', sans-serif" font-weight="600" font-size="10">Track Attack + Official DRS Logo</text>
  </g>
</svg>
