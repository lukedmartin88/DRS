<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="sample-bg-1" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#181c24" />
      <stop offset="60%" stop-color="#0e1014" />
      <stop offset="100%" stop-color="#060708" />
    </radialGradient>
    <linearGradient id="hoodie-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232730" />
      <stop offset="40%" stop-color="#14171d" />
      <stop offset="80%" stop-color="#0b0d10" />
      <stop offset="100%" stop-color="#171a22" />
    </linearGradient>
    <filter id="neon-glow-lime" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#84cc16" flood-opacity="0.8" />
    </filter>
    <filter id="neon-glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ec4899" flood-opacity="0.8" />
    </filter>
    <filter id="sample-drop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000" flood-opacity="0.85" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#sample-bg-1)" />
  <ellipse cx="400" cy="740" rx="300" ry="60" fill="#84cc16" opacity="0.08" />

  <!-- HOODIE BODY -->
  <g transform="translate(100, 30)" filter="url(#sample-drop)">
    <path d="M 180 80 C 120 90 40 160 0 280 C -5 295 10 320 30 310 C 70 270 100 230 115 210 L 110 630 C 110 655 140 665 180 665 L 420 665 C 460 665 490 655 490 630 L 485 210 C 500 230 530 270 570 310 C 590 320 605 295 600 280 C 560 160 480 90 420 80 Z" fill="url(#hoodie-grad-1)" />
    
    <!-- Hood -->
    <path d="M 180 80 C 170 30 220 10 300 10 C 380 10 430 30 420 80 C 410 135 370 155 300 155 C 230 155 190 135 180 80 Z" fill="#14171d" stroke="#0b0d10" stroke-width="2" />
    
    <!-- MAIN BACK PRINT: DESIRED DESIGN (Neon ST Drift) -->
    <g transform="translate(140, 210)">
      <rect width="320" height="340" rx="16" fill="#0d1117" stroke="#27272a" stroke-width="2" opacity="0.95" />
      
      <!-- Graphic Art Inside Print Area -->
      <!-- Turbo graphic -->
      <path d="M 160 60 C 210 60 235 95 235 140 C 235 185 200 215 150 215 C 110 215 85 185 85 140 C 85 105 110 85 140 80 L 140 45 L 180 45 L 180 65" fill="none" stroke="#84cc16" stroke-width="8" stroke-linecap="round" filter="url(#neon-glow-lime)" />
      <circle cx="160" cy="140" r="35" fill="#18181b" stroke="#ec4899" stroke-width="5" filter="url(#neon-glow-pink)" />
      <circle cx="160" cy="140" r="10" fill="#84cc16" />
      
      <!-- Neon Drift Streaks -->
      <path d="M 40 180 L 110 130 L 125 145 L 60 200 Z" fill="#84cc16" opacity="0.8" />
      <path d="M 210 130 L 280 80 L 290 95 L 230 150 Z" fill="#ec4899" opacity="0.8" />
      
      <text x="160" y="255" fill="#ffffff" font-family="'Montserrat', sans-serif" font-weight="900" font-size="20" text-anchor="middle" letter-spacing="3">NEON ST DRIFT</text>
      <text x="160" y="275" fill="#84cc16" font-family="'Montserrat', sans-serif" font-weight="700" font-size="10" text-anchor="middle" letter-spacing="4">HIGH BOOST SPEC</text>
      
      <!-- INTEGRATED DRS CLUB LOGO IN THE PRINT -->
      <g transform="translate(60, 290)">
        <rect width="200" height="34" rx="8" fill="#000000" stroke="#84cc16" stroke-width="1.5" />
        <circle cx="22" cy="17" r="9" fill="#84cc16" />
        <text x="22" y="21" fill="#000000" font-family="'Montserrat', sans-serif" font-weight="900" font-size="10" text-anchor="middle">DRS</text>
        <text x="40" y="21" fill="#ffffff" font-family="'Montserrat', sans-serif" font-weight="900" font-size="11" letter-spacing="1">DAILY RIDE SOUTH</text>
        <text x="165" y="21" fill="#84cc16" font-family="'Montserrat', sans-serif" font-weight="800" font-size="8">OFFICIAL</text>
      </g>
    </g>

    <!-- CHEST / EMBLEM EMBROIDERED DRS CLUB BADGE -->
    <g transform="translate(145, 120)">
      <circle cx="25" cy="25" r="24" fill="#0b0d10" stroke="#84cc16" stroke-width="2.5" filter="url(#neon-glow-lime)" />
      <text x="25" y="28" fill="#84cc16" font-family="'Montserrat', sans-serif" font-weight="900" font-size="12" text-anchor="middle" letter-spacing="1">DRS</text>
      <text x="25" y="38" fill="#ffffff" font-family="'Montserrat', sans-serif" font-weight="700" font-size="6" text-anchor="middle" letter-spacing="0.5">CLUB</text>
    </g>
  </g>

  <!-- SAMPLE BADGE OVERLAY -->
  <g transform="translate(40, 40)">
    <rect width="220" height="52" rx="14" fill="#000000" fill-opacity="0.85" stroke="#84cc16" stroke-width="1.5" />
    <text x="18" y="23" fill="#84cc16" font-family="'Montserrat', sans-serif" font-weight="900" font-size="12" letter-spacing="1">CUSTOM PRINT SAMPLE</text>
    <text x="18" y="41" fill="#a1a1aa" font-family="'Montserrat', sans-serif" font-weight="600" font-size="10">Neon ST Drift + Official DRS Logo</text>
  </g>
</svg>
