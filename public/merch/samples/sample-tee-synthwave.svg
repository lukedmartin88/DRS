<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="sample-bg-3" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1c1622" />
      <stop offset="60%" stop-color="#0e0a14" />
      <stop offset="100%" stop-color="#060408" />
    </radialGradient>
    <linearGradient id="cotton-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24222c" />
      <stop offset="25%" stop-color="#16141c" />
      <stop offset="70%" stop-color="#0e0c14" />
      <stop offset="100%" stop-color="#1c1824" />
    </linearGradient>
    <filter id="synth-pink-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ec4899" flood-opacity="0.8" />
    </filter>
    <filter id="synth-cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.8" />
    </filter>
    <filter id="tee-drop-3" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000" flood-opacity="0.85" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#sample-bg-3)" />
  <ellipse cx="400" cy="740" rx="300" ry="60" fill="#ec4899" opacity="0.08" />

  <!-- T-SHIRT SILHOUETTE -->
  <g transform="translate(100, 40)" filter="url(#tee-drop-3)">
    <!-- Collar -->
    <path d="M 230 40 Q 300 65 370 40 Q 300 25 230 40 Z" fill="#1e1c26" stroke="#0e0c14" stroke-width="2" />
    <!-- Body -->
    <path d="M 230 40 C 170 50 100 80 0 150 C -8 165 5 195 25 190 L 85 170 L 95 620 C 95 640 120 650 160 650 L 440 650 C 480 650 505 640 505 620 L 515 170 L 575 190 C 595 195 608 165 600 150 C 500 80 430 50 370 40 Q 300 65 230 40 Z" fill="url(#cotton-grad-3)" />
    
    <!-- MAIN CHEST PRINT: DESIRED DESIGN (Retro Synthwave Sunset) -->
    <g transform="translate(145, 170)">
      <rect width="310" height="340" rx="16" fill="#0d0a14" stroke="#27272a" stroke-width="2" opacity="0.95" />
      
      <!-- Synthwave Sun -->
      <circle cx="155" cy="120" r="55" fill="#f43f5e" filter="url(#synth-pink-glow)" />
      <!-- Horizontal sun cuts -->
      <line x1="100" y1="110" x2="210" y2="110" stroke="#0d0a14" stroke-width="3" />
      <line x1="105" y1="125" x2="205" y2="125" stroke="#0d0a14" stroke-width="4" />
      <line x1="115" y1="140" x2="195" y2="140" stroke="#0d0a14" stroke-width="5" />
      <line x1="130" y1="155" x2="180" y2="155" stroke="#0d0a14" stroke-width="6" />
      
      <!-- Perspective Grid -->
      <line x1="20" y1="210" x2="290" y2="210" stroke="#06b6d4" stroke-width="2" filter="url(#synth-cyan-glow)" />
      <line x1="40" y1="230" x2="270" y2="230" stroke="#06b6d4" stroke-width="1.5" />
      <line x1="65" y1="245" x2="245" y2="245" stroke="#06b6d4" stroke-width="1.2" />
      
      <text x="155" y="275" fill="#ffffff" font-family="'Montserrat', sans-serif" font-weight="900" font-size="18" text-anchor="middle" letter-spacing="3">SYNTHWAVE SUNSET</text>
      
      <!-- INTEGRATED DRS CLUB LOGO IN THE PRINT -->
      <g transform="translate(55, 290)">
        <rect width="200" height="34" rx="8" fill="#000000" stroke="#06b6d4" stroke-width="1.5" />
        <circle cx="22" cy="17" r="9" fill="#06b6d4" />
        <text x="22" y="21" fill="#000000" font-family="'Montserrat', sans-serif" font-weight="900" font-size="10" text-anchor="middle">DRS</text>
        <text x="40" y="21" fill="#ffffff" font-family="'Montserrat', sans-serif" font-weight="900" font-size="11" letter-spacing="1">DAILY RIDE SOUTH</text>
        <text x="165" y="21" fill="#06b6d4" font-family="'Montserrat', sans-serif" font-weight="800" font-size="8">CLUB</text>
      </g>
    </g>

    <!-- SLEEVE DRS LOGO BADGE -->
    <g transform="translate(520, 160)">
      <rect width="36" height="20" rx="4" fill="#000000" stroke="#ec4899" stroke-width="1.5" />
      <text x="18" y="14" fill="#ec4899" font-family="'Montserrat', sans-serif" font-weight="900" font-size="9" text-anchor="middle">DRS</text>
    </g>
  </g>

  <!-- SAMPLE BADGE OVERLAY -->
  <g transform="translate(40, 40)">
    <rect width="230" height="52" rx="14" fill="#000000" fill-opacity="0.85" stroke="#ec4899" stroke-width="1.5" />
    <text x="18" y="23" fill="#ec4899" font-family="'Montserrat', sans-serif" font-weight="900" font-size="12" letter-spacing="1">CUSTOM PRINT SAMPLE</text>
    <text x="18" y="41" fill="#a1a1aa" font-family="'Montserrat', sans-serif" font-weight="600" font-size="10">Synthwave Sunset + Official DRS Logo</text>
  </g>
</svg>
