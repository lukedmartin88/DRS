<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="sample-bg-2" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1c1822" />
      <stop offset="60%" stop-color="#0e0d14" />
      <stop offset="100%" stop-color="#06050a" />
    </radialGradient>
    <linearGradient id="hoodie-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24222c" />
      <stop offset="40%" stop-color="#15131c" />
      <stop offset="80%" stop-color="#0d0b13" />
      <stop offset="100%" stop-color="#1a1824" />
    </linearGradient>
    <filter id="neon-glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.8" />
    </filter>
    <filter id="sample-drop-2" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000" flood-opacity="0.85" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#sample-bg-2)" />
  <ellipse cx="400" cy="740" rx="300" ry="60" fill="#ef4444" opacity="0.08" />

  <!-- HOODIE BODY -->
  <g transform="translate(100, 30)" filter="url(#sample-drop-2)">
    <path d="M 180 80 C 120 90 40 160 0 280 C -5 295 10 320 30 310 C 70 270 100 230 115 210 L 110 630 C 110 655 140 665 180 665 L 420 665 C 460 665 490 655 490 630 L 485 210 C 500 230 530 270 570 310 C 590 320 605 295 600 280 C 560 160 480 90 420 80 Z" fill="url(#hoodie-grad-2)" />
    
    <!-- Hood -->
    <path d="M 180 80 C 170 30 220 10 300 10 C 380 10 430 30 420 80 C 410 135 370 155 300 155 C 230 155 190 135 180 80 Z" fill="#15131c" stroke="#0d0b13" stroke-width="2" />
    
    <!-- MAIN BACK PRINT: DESIRED DESIGN (Midnight Tokyo Touge) -->
    <g transform="translate(140, 210)">
      <rect width="320" height="340" rx="16" fill="#0d0e14" stroke="#27272a" stroke-width="2" opacity="0.95" />
      
      <!-- Red Sun / Touge Seal -->
      <circle cx="160" cy="130" r="65" fill="#dc2626" opacity="0.9" filter="url(#neon-glow-red)" />
      
      <!-- Kanji characters / Katakana -->
      <text x="160" y="145" fill="#ffffff" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="34" text-anchor="middle" letter-spacing="4">南走行部</text>
      
      <text x="160" y="245" fill="#ffffff" font-family="'Montserrat', sans-serif" font-weight="900" font-size="18" text-anchor="middle" letter-spacing="3">MIDNIGHT TOKYO</text>
      <text x="160" y="265" fill="#ef4444" font-family="'Montserrat', sans-serif" font-weight="700" font-size="10" text-anchor="middle" letter-spacing="4">JDM STREET TOUGE</text>
      
      <!-- INTEGRATED DRS CLUB LOGO IN THE PRINT -->
      <g transform="translate(60, 285)">
        <rect width="200" height="36" rx="8" fill="#000000" stroke="#ef4444" stroke-width="1.5" />
        <circle cx="24" cy="18" r="10" fill="#dc2626" />
        <text x="24" y="22" fill="#ffffff" font-family="'Montserrat', sans-serif" font-weight="900" font-size="10" text-anchor="middle">DRS</text>
        <text x="44" y="22" fill="#ffffff" font-family="'Montserrat', sans-serif" font-weight="900" font-size="11" letter-spacing="1">DAILY RIDE SOUTH</text>
        <text x="165" y="22" fill="#ef4444" font-family="'Montserrat', sans-serif" font-weight="800" font-size="8">CLUB</text>
      </g>
    </g>

    <!-- CHEST / EMBLEM EMBROIDERED DRS CLUB BADGE -->
    <g transform="translate(145, 120)">
      <circle cx="25" cy="25" r="24" fill="#0b0d10" stroke="#ef4444" stroke-width="2" filter="url(#neon-glow-red)" />
      <text x="25" y="28" fill="#ef4444" font-family="'Montserrat', sans-serif" font-weight="900" font-size="12" text-anchor="middle" letter-spacing="1">DRS</text>
      <text x="25" y="38" fill="#ffffff" font-family="'Montserrat', sans-serif" font-weight="700" font-size="6" text-anchor="middle" letter-spacing="0.5">CLUB</text>
    </g>
  </g>

  <!-- SAMPLE BADGE OVERLAY -->
  <g transform="translate(40, 40)">
    <rect width="230" height="52" rx="14" fill="#000000" fill-opacity="0.85" stroke="#ef4444" stroke-width="1.5" />
    <text x="18" y="23" fill="#ef4444" font-family="'Montserrat', sans-serif" font-weight="900" font-size="12" letter-spacing="1">CUSTOM PRINT SAMPLE</text>
    <text x="18" y="41" fill="#a1a1aa" font-family="'Montserrat', sans-serif" font-weight="600" font-size="10">Midnight Tokyo + Official DRS Logo</text>
  </g>
</svg>
