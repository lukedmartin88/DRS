<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="sample-bg-5" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#141c18" />
      <stop offset="60%" stop-color="#0a0f0d" />
      <stop offset="100%" stop-color="#040605" />
    </radialGradient>
    <linearGradient id="cotton-grad-5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#202622" />
      <stop offset="25%" stop-color="#121614" />
      <stop offset="70%" stop-color="#0a0e0c" />
      <stop offset="100%" stop-color="#161c18" />
    </linearGradient>
    <filter id="photo-green-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.8" />
    </filter>
    <filter id="tee-drop-5" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000" flood-opacity="0.85" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#sample-bg-5)" />
  <ellipse cx="400" cy="740" rx="300" ry="60" fill="#10b981" opacity="0.08" />

  <!-- T-SHIRT SILHOUETTE -->
  <g transform="translate(100, 40)" filter="url(#tee-drop-5)">
    <!-- Collar -->
    <path d="M 230 40 Q 300 65 370 40 Q 300 25 230 40 Z" fill="#18201a" stroke="#0a0e0c" stroke-width="2" />
    <!-- Body -->
    <path d="M 230 40 C 170 50 100 80 0 150 C -8 165 5 195 25 190 L 85 170 L 95 620 C 95 640 120 650 160 650 L 440 650 C 480 650 505 640 505 620 L 515 170 L 575 190 C 595 195 608 165 600 150 C 500 80 430 50 370 40 Q 300 65 230 40 Z" fill="url(#cotton-grad-5)" />
    
    <!-- MAIN CHEST PRINT: CUSTOM CAR PHOTO MOCKUP + DRS CLUB LOGO -->
    <g transform="translate(145, 160)">
      <rect width="310" height="360" rx="16" fill="#080c09" stroke="#27272a" stroke-width="2" opacity="0.95" />
      
      <!-- Photo Frame / Polaroid Style / High Def Car Silhouette -->
      <g transform="translate(20, 20)">
        <rect width="270" height="190" rx="10" fill="#111813" stroke="#10b981" stroke-width="1.5" />
        
        <!-- Car Silhouette graphic -->
        <path d="M 30 150 L 50 125 C 70 120 90 95 130 90 L 190 90 C 215 95 230 120 240 135 L 250 150 Z" fill="#10b981" opacity="0.85" filter="url(#photo-green-glow)" />
        <circle cx="70" cy="150" r="18" fill="#000000" stroke="#ffffff" stroke-width="3" />
        <circle cx="210" cy="150" r="18" fill="#000000" stroke="#ffffff" stroke-width="3" />
        <line x1="10" y1="168" x2="260" y2="168" stroke="#10b981" stroke-width="2" />
        
        <!-- Camera badge -->
        <rect x="15" y="15" width="105" height="22" rx="6" fill="#000000" fill-opacity="0.8" />
        <text x="23" y="30" fill="#10b981" font-family="'Montserrat', sans-serif" font-weight="800" font-size="9">CUSTOMER PHOTO</text>
      </g>
      
      <text x="155" y="245" fill="#ffffff" font-family="'Montserrat', sans-serif" font-weight="900" font-size="16" text-anchor="middle" letter-spacing="2">BESPOKE CAR PRINT</text>
      <text x="155" y="265" fill="#a1a1aa" font-family="'Montserrat', sans-serif" font-weight="600" font-size="11" text-anchor="middle">Customer Uploaded Photo Artwork</text>
      
      <!-- INTEGRATED DRS CLUB LOGO IN THE PRINT -->
      <g transform="translate(55, 290)">
        <rect width="200" height="38" rx="8" fill="#000000" stroke="#10b981" stroke-width="1.5" />
        <circle cx="24" cy="19" r="10" fill="#10b981" />
        <text x="24" y="23" fill="#000000" font-family="'Montserrat', sans-serif" font-weight="900" font-size="10" text-anchor="middle">DRS</text>
        <text x="44" y="23" fill="#ffffff" font-family="'Montserrat', sans-serif" font-weight="900" font-size="11" letter-spacing="1">DAILY RIDE SOUTH</text>
        <text x="165" y="23" fill="#10b981" font-family="'Montserrat', sans-serif" font-weight="800" font-size="8">CLUB</text>
      </g>
    </g>

    <!-- SLEEVE DRS LOGO BADGE -->
    <g transform="translate(520, 160)">
      <rect width="36" height="20" rx="4" fill="#000000" stroke="#10b981" stroke-width="1.5" />
      <text x="18" y="14" fill="#10b981" font-family="'Montserrat', sans-serif" font-weight="900" font-size="9" text-anchor="middle">DRS</text>
    </g>
  </g>

  <!-- SAMPLE BADGE OVERLAY -->
  <g transform="translate(40, 40)">
    <rect width="250" height="52" rx="14" fill="#000000" fill-opacity="0.85" stroke="#10b981" stroke-width="1.5" />
    <text x="18" y="23" fill="#10b981" font-family="'Montserrat', sans-serif" font-weight="900" font-size="12" letter-spacing="1">CUSTOM PHOTO SAMPLE</text>
    <text x="18" y="41" fill="#a1a1aa" font-family="'Montserrat', sans-serif" font-weight="600" font-size="10">Customer Car Photo + Official DRS Logo</text>
  </g>
</svg>
