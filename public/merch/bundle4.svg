<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="b4-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1b2029" />
      <stop offset="60%" stop-color="#0f1115" />
      <stop offset="100%" stop-color="#060708" />
    </radialGradient>
    <filter id="b4-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000" flood-opacity="0.85" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#b4-bg)" />
  <ellipse cx="400" cy="530" rx="360" ry="40" fill="#84cc16" opacity="0.08" />

  <!-- Badge banner: BUNDLE 4 Stay Warm -->
  <g transform="translate(40, 35)">
    <rect width="280" height="42" rx="10" fill="#9333ea" />
    <text x="140" y="27" font-family="'Impact', Arial Black, sans-serif" font-size="20" font-style="italic" fill="#ffffff" text-anchor="middle" letter-spacing="1">BUNDLE 4: STAY WARM • £60</text>
  </g>
  <g transform="translate(620, 35)">
    <rect width="140" height="42" rx="10" fill="#84cc16" />
    <text x="70" y="27" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#000" text-anchor="middle">WINTER SET</text>
  </g>

  <!-- Items: Beanie, Hoodie, Jacket -->
  <!-- Beanie -->
  <g transform="translate(30, 140) scale(0.44)" filter="url(#b4-shadow)">
    <path d="M 80 320 C 60 160 160 40 250 40 C 340 40 440 160 420 320 Z" fill="#14171d" stroke="#2c3340" stroke-width="3" />
    <rect x="60" y="270" width="380" height="90" rx="15" fill="#1d222b" stroke="#373e4d" stroke-width="2" />
    <text x="250" y="330" font-family="'Impact', Arial Black, sans-serif" font-size="44" fill="#a3e635" text-anchor="middle">DRS</text>
    <text x="250" y="440" font-family="'Impact', Arial, sans-serif" font-size="34" fill="#ffffff" text-anchor="middle">BEANIE</text>
  </g>

  <text x="270" y="260" font-family="'Impact', Arial Black, sans-serif" font-size="36" fill="#84cc16" text-anchor="middle">+</text>

  <!-- Hoodie -->
  <g transform="translate(270, 95) scale(0.50)" filter="url(#b4-shadow)">
    <path d="M 160 50 C 180 15 320 15 340 50 C 370 90 360 130 340 140 C 310 130 190 130 160 140 C 140 130 130 90 160 50 Z" fill="#0d0f12" />
    <path d="M 150 110 L 40 190 L 80 280 L 140 240 L 140 490 L 360 490 L 360 240 L 420 280 L 460 190 L 350 110 Z" fill="#191d24" stroke="#333a48" stroke-width="3" />
    <path d="M 170 380 L 330 380 L 310 470 L 190 470 Z" fill="#11141a" stroke="#252b36" stroke-width="2" />
    <text x="250" y="260" font-family="'Impact', Arial Black, sans-serif" font-size="44" font-style="italic" fill="#ec4899" text-anchor="middle">DRS</text>
    <text x="250" y="550" font-family="'Impact', Arial, sans-serif" font-size="34" fill="#ffffff" text-anchor="middle">HOODIE</text>
  </g>

  <text x="525" y="260" font-family="'Impact', Arial Black, sans-serif" font-size="36" fill="#84cc16" text-anchor="middle">+</text>

  <!-- Jacket -->
  <g transform="translate(525, 95) scale(0.50)" filter="url(#b4-shadow)">
    <path d="M 160 40 C 190 10 310 10 340 40 C 380 90 370 140 340 150 C 310 140 190 140 160 150 Z" fill="#0d0f12" />
    <path d="M 160 110 L 40 190 L 80 280 L 140 240 L 140 490 L 360 490 L 360 240 L 420 280 L 460 190 L 340 110 Z" fill="#20242d" stroke="#384050" stroke-width="3" />
    <line x1="250" y1="120" x2="250" y2="490" stroke="#000" stroke-width="4" />
    <rect x="200" y="210" width="4" height="60" fill="#84cc16" />
    <text x="250" y="550" font-family="'Impact', Arial, sans-serif" font-size="34" fill="#ffffff" text-anchor="middle">JACKET</text>
  </g>
</svg>
