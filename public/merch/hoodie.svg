<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="studio-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#181c24" />
      <stop offset="60%" stop-color="#0e1014" />
      <stop offset="100%" stop-color="#060708" />
    </radialGradient>

    <!-- Black Fleece Fabric Gradient -->
    <linearGradient id="fabric-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2229" />
      <stop offset="30%" stop-color="#13161a" />
      <stop offset="70%" stop-color="#0b0d10" />
      <stop offset="100%" stop-color="#171a20" />
    </linearGradient>

    <!-- Hood Fabric Shading -->
    <linearGradient id="hood-fold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2f38" />
      <stop offset="50%" stop-color="#121418" />
      <stop offset="100%" stop-color="#08090b" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="hoodie-neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#84cc16" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#84cc16" flood-opacity="0.3" />
    </filter>

    <filter id="hoodie-pink-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ec4899" flood-opacity="0.7" />
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#ec4899" flood-opacity="0.35" />
    </filter>

    <filter id="garment-drop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="30" stdDeviation="35" flood-color="#000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Studio Backdrop -->
  <rect width="800" height="900" fill="url(#studio-bg)" />

  <!-- Ambient Floor Horizon Glow -->
  <ellipse cx="400" cy="850" rx="350" ry="80" fill="#84cc16" opacity="0.08" />

  <!-- HOODIE SILHOUETTE (Rear View) -->
  <g transform="translate(100, 40)" filter="url(#garment-drop)">
    <!-- Main Body & Sleeves Outline -->
    <path d="M 180 80
             C 120 90 40 160 0 280
             C -5 295 10 320 30 310
             C 70 270 100 230 115 210
             L 110 650
             C 110 675 140 685 180 685
             L 420 685
             C 460 685 490 675 490 650
             L 485 210
             C 500 230 530 270 570 310
             C 590 320 605 295 600 280
             C 560 160 480 90 420 80
             Z"
          fill="url(#fabric-base)" />

    <!-- Sleeve Seam Creases & Highlights -->
    <path d="M 115 210 Q 140 380 110 650" stroke="#000" stroke-width="3" fill="none" opacity="0.7" />
    <path d="M 485 210 Q 460 380 490 650" stroke="#000" stroke-width="3" fill="none" opacity="0.7" />
    <path d="M 120 215 Q 145 380 115 645" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.12" />

    <!-- Ribbed Bottom Hem Band -->
    <rect x="110" y="635" width="380" height="50" rx="10" fill="#111317" stroke="#07080a" stroke-width="1.5" />
    <line x1="110" y1="645" x2="490" y2="645" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
    <line x1="110" y1="660" x2="490" y2="660" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
    <line x1="110" y1="675" x2="490" y2="675" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />

    <!-- Ribbed Cuffs -->
    <path d="M 0 280 L 30 310 L 45 295 L 15 265 Z" fill="#111317" opacity="0.9" />
    <path d="M 600 280 L 570 310 L 555 295 L 585 265 Z" fill="#111317" opacity="0.9" />

    <!-- Hood (Relaxed over shoulders, rear view) -->
    <path d="M 180 80
             C 170 30 220 5 300 5
             C 380 5 430 30 420 80
             C 410 135 370 160 300 160
             C 230 160 190 135 180 80
             Z"
          fill="url(#hood-fold)"
          stroke="#0b0d10"
          stroke-width="3" />

    <!-- Hood Inner Crease / Neck Fold -->
    <path d="M 210 75 C 240 120 360 120 390 75" fill="none" stroke="#000000" stroke-width="6" opacity="0.9" />
    <path d="M 215 78 C 245 116 355 116 385 78" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.15" />

    <!-- Drawstring Tips -->
    <line x1="260" y1="135" x2="255" y2="190" stroke="#333" stroke-width="4" stroke-linecap="round" />
    <rect x="253" y="185" width="4" height="12" fill="#84cc16" rx="2" />
    <line x1="340" y1="135" x2="345" y2="190" stroke="#333" stroke-width="4" stroke-linecap="round" />
    <rect x="343" y="185" width="4" height="12" fill="#84cc16" rx="2" />

    <!-- BACK PRINT DESIGN: DRS RACING LOGO & FIESTA ST ARTWORK -->
    <g transform="translate(45, 120)">
      <!-- Neon Splash Streaks (Angled dynamic brush artwork) -->
      <!-- Green Splashes -->
      <path d="M 110 390 L 190 310 L 230 340 L 170 420 Z" fill="#84cc16" opacity="0.75" />
      <path d="M 90 410 L 140 370 L 150 390 L 110 425 Z" fill="#84cc16" opacity="0.6" />
      <polygon points="120,440 200,370 210,390 140,460" fill="#a3e635" opacity="0.8" />
      <!-- Pink Splashes -->
      <path d="M 330 280 L 430 210 L 450 240 L 370 320 Z" fill="#ec4899" opacity="0.85" />
      <path d="M 370 330 L 450 270 L 460 290 L 400 350 Z" fill="#f43f5e" opacity="0.7" />
      <polygon points="320,380 430,290 445,310 350,400" fill="#ec4899" opacity="0.75" />

      <!-- DRS LOGO FRAME (Neon Green) -->
      <g filter="url(#hoodie-neon-glow)">
        <path d="M 100 120
                 L 130 90
                 L 380 90
                 L 410 120
                 L 410 200
                 L 380 230
                 L 130 230
                 L 100 200
                 Z"
              fill="none"
              stroke="#84cc16"
              stroke-width="7"
              stroke-linejoin="round" />
        <line x1="85" y1="160" x2="100" y2="160" stroke="#84cc16" stroke-width="7" />
        <line x1="410" y1="160" x2="425" y2="160" stroke="#84cc16" stroke-width="7" />
      </g>

      <!-- DRS Letters -->
      <!-- D (Lime Green) -->
      <path d="M 125 115 L 180 115 C 205 115 218 128 218 145 L 218 175 C 218 192 205 205 180 205 L 125 205 Z M 150 138 L 150 182 L 175 182 C 185 182 190 178 190 168 L 190 152 C 190 142 185 138 175 138 Z"
            fill="#a3e635" filter="url(#hoodie-neon-glow)" />

      <!-- R (Vibrant Pink) -->
      <path d="M 215 115 L 265 115 C 285 115 298 125 298 142 C 298 155 288 165 275 168 L 305 205 L 275 205 L 252 170 L 242 170 L 242 205 L 215 205 Z M 242 135 L 242 152 L 262 152 C 268 152 272 148 272 144 C 272 139 268 135 262 135 Z"
            fill="#ec4899" filter="url(#hoodie-pink-glow)" />

      <!-- S (Lime Green) -->
      <path d="M 305 185 L 328 185 C 338 185 344 180 344 172 C 344 165 338 160 322 156 C 306 151 298 145 298 132 C 298 120 312 115 332 115 L 362 115 L 362 135 L 334 135 C 328 135 324 138 324 142 C 324 146 328 149 342 152 C 360 157 370 165 370 176 C 370 192 355 205 330 205 L 305 205 Z"
            fill="#a3e635" filter="url(#hoodie-neon-glow)" />

      <!-- DAILY RIDE SOUTH Subtitle -->
      <text x="255" y="260"
            font-family="'Montserrat', 'Arial Black', sans-serif"
            font-size="22"
            font-weight="900"
            font-style="italic"
            letter-spacing="4"
            text-anchor="middle"
            fill="#84cc16"
            filter="url(#hoodie-neon-glow)">
        DAILY <tspan fill="#ec4899" filter="url(#hoodie-pink-glow)">RIDE</tspan> SOUTH
      </text>

      <!-- FIESTA ST CAR GRAPHIC (Front 3/4 Hot Hatch with Neon Accents) -->
      <g transform="translate(145, 275)">
        <!-- Car Shadow -->
        <ellipse cx="110" cy="180" rx="120" ry="18" fill="#000" opacity="0.9" />

        <!-- Car Body Outline (Aggressive Hot Hatch) -->
        <!-- Roof & Windshield -->
        <path d="M 50 70 L 80 20 L 150 20 L 180 70 Z" fill="#0b0d10" stroke="#1f242d" stroke-width="2" />
        <path d="M 55 68 L 82 25 L 145 25 L 172 68 Z" fill="#141820" opacity="0.85" />
        <!-- Front Bonnet / Hood -->
        <path d="M 35 70 L 190 70 L 180 110 L 40 110 Z" fill="#141820" stroke="#84cc16" stroke-width="1.5" />
        <!-- Aggressive Honeycomb ST Grille -->
        <polygon points="50,110 170,110 160,150 60,150" fill="#060709" stroke="#ec4899" stroke-width="1.5" />
        <!-- Red/Pink ST Badge -->
        <rect x="145" y="125" width="16" height="8" rx="2" fill="#ec4899" />
        <text x="153" y="132" font-family="sans-serif" font-size="7" font-weight="900" fill="#fff" text-anchor="middle">ST</text>

        <!-- Headlights with Neon DRL Glow -->
        <polygon points="35,80 65,85 55,105 25,95" fill="#f0fdf4" stroke="#84cc16" stroke-width="2" filter="url(#hoodie-neon-glow)" />
        <polygon points="185,80 155,85 165,105 195,95" fill="#f0fdf4" stroke="#84cc16" stroke-width="2" filter="url(#hoodie-neon-glow)" />

        <!-- Front Splitter Aero Kit (Neon Lime Accent) -->
        <path d="M 20 155 L 70 165 L 150 165 L 200 155 L 205 162 L 145 172 L 75 172 L 15 162 Z" fill="#84cc16" filter="url(#hoodie-neon-glow)" />

        <!-- Wheels / Low Stance Tires -->
        <ellipse cx="35" cy="155" rx="18" ry="24" fill="#000" stroke="#333" stroke-width="3" />
        <circle cx="35" cy="155" r="12" fill="#111" stroke="#ec4899" stroke-width="2" />
        <ellipse cx="185" cy="155" rx="18" ry="24" fill="#000" stroke="#333" stroke-width="3" />
        <circle cx="185" cy="155" r="12" fill="#ec4899" stroke="#84cc16" stroke-width="2" />
      </g>
    </g>
  </g>

  <!-- Product Badge Top Left -->
  <g transform="translate(50, 45)">
    <rect width="130" height="34" rx="17" fill="#000000" stroke="#84cc16" stroke-width="1.5" opacity="0.95" />
    <circle cx="18" cy="17" r="5" fill="#84cc16" />
    <text x="34" y="22" font-family="'Montserrat', sans-serif" font-size="11" font-weight="900" fill="#84cc16" letter-spacing="1.5">HOODIE</text>
  </g>

  <!-- Fabric Specs Bottom -->
  <g transform="translate(520, 835)">
    <rect width="230" height="28" rx="6" fill="#101216" stroke="#222730" stroke-width="1" />
    <text x="115" y="18" font-family="monospace" font-size="10" font-weight="700" fill="#9ca3af" text-anchor="middle" letter-spacing="1.5">380GSM HEAVYWEIGHT FLEECE</text>
  </g>
</svg>
