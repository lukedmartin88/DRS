<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="b3-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1b2029" />
      <stop offset="60%" stop-color="#0f1115" />
      <stop offset="100%" stop-color="#060708" />
    </radialGradient>
    <filter id="b3-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000" flood-opacity="0.85" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#b3-bg)" />
  <ellipse cx="400" cy="530" rx="360" ry="40" fill="#84cc16" opacity="0.08" />

  <!-- Badge banner: BUNDLE 3 Show Season -->
  <g transform="translate(40, 35)">
    <rect width="280" height="42" rx="10" fill="#2563eb" />
    <text x="140" y="27" font-family="'Impact', Arial Black, sans-serif" font-size="20" font-style="italic" fill="#ffffff" text-anchor="middle" letter-spacing="1">BUNDLE 3: SHOW SEASON • £30</text>
  </g>
  <g transform="translate(620, 35)">
    <rect width="140" height="42" rx="10" fill="#84cc16" />
    <text x="70" y="27" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#000" text-anchor="middle">SAVE £4</text>
  </g>

  <!-- Items: Bucket Hat, T-Shirt, Sunglasses -->
  <!-- Bucket Hat -->
  <g transform="translate(40, 150) scale(0.40)" filter="url(#b3-shadow)">
    <path d="M 0 350 C 10 330 80 300 120 280 C 240 250 360 250 480 280 C 520 300 590 330 600 350 C 550 460 380 500 300 500 C 220 500 50 460 0 350 Z" fill="#14171d" stroke="#252b36" stroke-width="3" />
    <path d="M 120 280 L 155 70 C 210 50 390 50 445 70 L 480 280 Z" fill="#1b1f27" stroke="#2c3340" stroke-width="3" />
    <text x="300" y="200" font-family="'Impact', Arial Black, sans-serif" font-size="52" fill="#a3e635" text-anchor="middle">DRS</text>
    <text x="300" y="580" font-family="'Impact', Arial, sans-serif" font-size="44" fill="#ffffff" text-anchor="middle">BUCKET HAT</text>
  </g>

  <text x="270" y="260" font-family="'Impact', Arial Black, sans-serif" font-size="36" fill="#84cc16" text-anchor="middle">+</text>

  <!-- T-Shirt -->
  <g transform="translate(270, 110) scale(0.48)" filter="url(#b3-shadow)">
    <path d="M 120 40 L 40 100 L 90 190 L 140 160 L 140 460 L 360 460 L 360 160 L 410 190 L 460 100 L 380 40 C 330 75 170 75 120 40 Z" fill="#14171d" stroke="#2c3340" stroke-width="3" />
    <text x="250" y="280" font-family="'Impact', Arial Black, sans-serif" font-size="44" font-style="italic" fill="#ec4899" text-anchor="middle">DRS</text>
    <text x="250" y="520" font-family="'Impact', Arial, sans-serif" font-size="34" fill="#ffffff" text-anchor="middle">T-SHIRT</text>
  </g>

  <text x="525" y="260" font-family="'Impact', Arial Black, sans-serif" font-size="36" fill="#84cc16" text-anchor="middle">+</text>

  <!-- Sunglasses -->
  <g transform="translate(530, 160) scale(0.38)" filter="url(#b3-shadow)">
    <!-- Frame -->
    <rect x="20" y="80" width="560" height="240" rx="30" fill="#14171d" stroke="#333a46" stroke-width="8" />
    <ellipse cx="160" cy="200" rx="100" ry="80" fill="#080a0d" stroke="#222" stroke-width="4" />
    <ellipse cx="440" cy="200" rx="100" ry="80" fill="#080a0d" stroke="#222" stroke-width="4" />
    <text x="300" y="210" font-family="'Impact', Arial Black, sans-serif" font-size="54" fill="#a3e635" text-anchor="middle">DRS</text>
    <text x="300" y="400" font-family="'Impact', Arial, sans-serif" font-size="44" fill="#ffffff" text-anchor="middle">SUNGLASSES</text>
  </g>
</svg>
