<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Tinted Glass Gradient -->
    <linearGradient id="glass-tint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181d22" />
      <stop offset="30%" stop-color="#0f1217" />
      <stop offset="70%" stop-color="#090b0e" />
      <stop offset="100%" stop-color="#1a2e1e" />
    </linearGradient>

    <!-- Metallic Green Car Paint Gradient -->
    <linearGradient id="mean-green-paint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="25%" stop-color="#16a34a" />
      <stop offset="50%" stop-color="#4ade80" />
      <stop offset="75%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>

    <!-- Defroster Wire Pattern -->
    <pattern id="defroster-lines" width="800" height="48" patternUnits="userSpaceOnUse">
      <line x1="0" y1="24" x2="800" y2="24" stroke="#d97706" stroke-opacity="0.3" stroke-width="1.2" />
    </pattern>

    <!-- Sticker Glow Filters -->
    <filter id="sticker-green-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#84cc16" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <filter id="sticker-pink-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ec4899" flood-opacity="0.7" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <!-- Sticker Vinyl Thickness Shadow -->
    <filter id="diecut-bevel" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Car Window Background -->
  <rect width="800" height="800" fill="url(#glass-tint)" />

  <!-- Rear Heated Window Demister Lines -->
  <rect width="800" height="620" fill="url(#defroster-lines)" />

  <!-- Rear Wiper Arm Top Silhouette -->
  <path d="M 680 180 L 380 240 L 375 255 L 685 190 Z" fill="#111418" opacity="0.85" />
  <circle cx="682" cy="185" r="14" fill="#0d0f12" stroke="#2a2f38" stroke-width="2" />

  <!-- Lower Car Body Boot Lid (Metallic Mean-Green Ford Fiesta ST Panel) -->
  <g transform="translate(0, 620)">
    <!-- Metallic Green Paint Panel -->
    <path d="M 0 0 Q 400 35 800 0 L 800 180 L 0 180 Z" fill="url(#mean-green-paint)" />
    <!-- Glass Rubber Bezel / Seal -->
    <path d="M 0 0 Q 400 35 800 0 L 800 14 Q 400 48 0 14 Z" fill="#0b0d10" />

    <!-- Red ST Badge on Boot -->
    <g transform="translate(680, 50)">
      <rect width="48" height="24" rx="4" fill="#dc2626" stroke="#b91c1c" stroke-width="1.5" />
      <text x="24" y="17" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">ST</text>
    </g>

    <!-- D26 DRS Numberplate Mockup (Center) -->
    <g transform="translate(310, 55)">
      <rect width="180" height="42" rx="6" fill="#facc15" stroke="#000" stroke-width="2" />
      <text x="90" y="29" font-family="'Charles Wright', 'Impact', sans-serif" font-size="24" font-weight="900" fill="#000" text-anchor="middle" letter-spacing="3">D26 DRS</text>
    </g>
  </g>

  <!-- PRECISION DIE-CUT VINYL DECAL (Centered on Window Glass) -->
  <g transform="translate(160, 190)" filter="url(#diecut-bevel)">
    <!-- Vinyl Decal Gloss Surface Outline Frame (Neon Lime Green) -->
    <g filter="url(#sticker-green-glow)">
      <path d="M 60 110
               L 95 75
               L 385 75
               L 420 110
               L 420 205
               L 385 240
               L 95 240
               L 60 205
               Z"
            fill="none"
            stroke="#84cc16"
            stroke-width="10"
            stroke-linejoin="round" />

      <!-- Side Accent Nibs -->
      <line x1="42" y1="157" x2="60" y2="157" stroke="#84cc16" stroke-width="10" />
      <line x1="420" y1="157" x2="438" y2="157" stroke="#84cc16" stroke-width="10" />
    </g>

    <!-- DRS LETTERS DIE-CUT VINYL -->
    <!-- D - Neon Lime Green -->
    <g filter="url(#sticker-green-glow)">
      <path d="M 90 100
               L 165 100
               C 195 100 212 115 212 135
               L 212 180
               C 212 200 195 215 165 215
               L 90 215
               Z
               M 125 125
               L 125 190
               L 155 190
               C 170 190 178 184 178 172
               L 178 143
               C 178 131 170 125 155 125
               Z"
            fill="#a3e635" />
    </g>

    <!-- R - Vibrant Hot Magenta Pink -->
    <g filter="url(#sticker-pink-glow)">
      <path d="M 210 100
               L 270 100
               C 295 100 310 112 310 132
               C 310 148 298 158 282 162
               L 318 215
               L 282 215
               L 252 168
               L 242 168
               L 242 215
               L 210 215
               Z
               M 242 122
               L 242 146
               L 266 146
               C 274 146 278 141 278 134
               C 278 127 274 122 266 122
               Z"
            fill="#ec4899" />
    </g>

    <!-- S - Neon Lime Green -->
    <g filter="url(#sticker-green-glow)">
      <path d="M 315 190
               L 345 190
               C 358 190 366 184 366 174
               C 366 165 358 158 338 153
               C 318 147 308 140 308 124
               C 308 108 325 100 350 100
               L 385 100
               L 385 124
               L 352 124
               C 345 124 340 127 340 132
               C 340 137 345 140 362 144
               C 385 150 398 160 398 174
               C 398 195 378 215 348 215
               L 315 215
               Z"
            fill="#a3e635" />
    </g>

    <!-- DAILY RIDE SOUTH Subtitle Decal -->
    <g filter="url(#sticker-green-glow)">
      <text x="240" y="275"
            font-family="'Montserrat', 'Arial Black', sans-serif"
            font-size="26"
            font-weight="900"
            font-style="italic"
            letter-spacing="5"
            text-anchor="middle"
            fill="#84cc16">
        DAILY <tspan fill="#ec4899" filter="url(#sticker-pink-glow)">RIDE</tspan> SOUTH
      </text>

      <!-- Decal Underline Slashes -->
      <line x1="80" y1="300" x2="400" y2="300" stroke="#84cc16" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Clear Transfer Film Peel Corner Mockup (Showing real vinyl application) -->
    <g transform="translate(370, 40)" opacity="0.85">
      <polygon points="0,0 80,0 80,80" fill="#ffffff" fill-opacity="0.35" stroke="#ffffff" stroke-width="1.5" />
      <line x1="0" y1="0" x2="80" y2="80" stroke="#84cc16" stroke-width="1.5" />
      <text x="45" y="32" font-family="monospace" font-size="8" font-weight="700" fill="#000" transform="rotate(45, 45, 32)">TRANSFER TAPE</text>
    </g>
  </g>

  <!-- Tag Pill Top Left -->
  <g transform="translate(50, 45)">
    <rect width="170" height="34" rx="17" fill="#000000" stroke="#4ade80" stroke-width="1.5" opacity="0.95" />
    <circle cx="18" cy="17" r="5" fill="#4ade80" />
    <text x="34" y="22" font-family="'Montserrat', sans-serif" font-size="11" font-weight="900" fill="#4ade80" letter-spacing="1.5">CAR STICKERS</text>
  </g>

  <!-- Vinyl Quality Spec Bottom Right -->
  <g transform="translate(480, 740)">
    <rect width="270" height="30" rx="8" fill="#0b0d10" stroke="#22c55e" stroke-width="1" />
    <text x="135" y="19" font-family="monospace" font-size="10" font-weight="700" fill="#4ade80" text-anchor="middle" letter-spacing="1.5">7-YEAR EXTERIOR VINYL • 100% WATERPROOF</text>
  </g>
</svg>
