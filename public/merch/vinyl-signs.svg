<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Dark Architectural Wall Gradient -->
    <linearGradient id="sign-wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0d12" />
      <stop offset="50%" stop-color="#12151d" />
      <stop offset="100%" stop-color="#08090c" />
    </linearGradient>

    <!-- Corrugated Cladding Pattern -->
    <pattern id="brick-wall" width="60" height="30" patternUnits="userSpaceOnUse">
      <rect width="60" height="30" fill="#12151b" />
      <line x1="0" y1="30" x2="60" y2="30" stroke="#090a0e" stroke-width="2" />
      <line x1="60" y1="0" x2="60" y2="30" stroke="#090a0e" stroke-width="2" />
    </pattern>

    <!-- Neon Glow Filters -->
    <filter id="neon-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="c1" />
      <feGaussianBlur stdDeviation="9" result="c2" />
      <feGaussianBlur stdDeviation="22" result="c3" />
      <feGaussianBlur stdDeviation="45" result="c4" />
      <feMerge>
        <feMergeNode in="c4" />
        <feMergeNode in="c3" />
        <feMergeNode in="c2" />
        <feMergeNode in="c1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neon-pink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="p1" />
      <feGaussianBlur stdDeviation="9" result="p2" />
      <feGaussianBlur stdDeviation="22" result="p3" />
      <feGaussianBlur stdDeviation="45" result="p4" />
      <feMerge>
        <feMergeNode in="p4" />
        <feMergeNode in="p3" />
        <feMergeNode in="p2" />
        <feMergeNode in="p1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ambient-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <filter id="board-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000" flood-opacity="0.95" />
    </filter>
  </defs>

  <!-- Wall Background -->
  <rect width="800" height="800" fill="url(#sign-wall)" />
  <rect width="800" height="800" fill="url(#brick-wall)" opacity="0.35" />

  <!-- Ambient Wall Color Cast -->
  <circle cx="400" cy="380" r="300" fill="#06b6d4" opacity="0.12" filter="url(#ambient-glow)" />
  <circle cx="400" cy="420" r="280" fill="#ec4899" opacity="0.1" filter="url(#ambient-glow)" />

  <!-- Acrylic Signboard Floating Assembly -->
  <g transform="translate(90, 110)" filter="url(#board-shadow)">
    <!-- Acrylic Backer Plate (620x560) -->
    <rect x="0" y="0" width="620" height="560" rx="28" fill="#0d1015" stroke="#1f2530" stroke-width="2.5" />
    <rect x="8" y="8" width="604" height="544" rx="22" fill="#08090d" />

    <!-- Corner Metallic Standoff Mounts -->
    <circle cx="32" cy="32" r="10" fill="#334155" stroke="#64748b" stroke-width="1.5" />
    <circle cx="588" cy="32" r="10" fill="#334155" stroke="#64748b" stroke-width="1.5" />
    <circle cx="32" cy="528" r="10" fill="#334155" stroke="#64748b" stroke-width="1.5" />
    <circle cx="588" cy="528" r="10" fill="#334155" stroke="#64748b" stroke-width="1.5" />

    <!-- Outer Decorative Neon Frame (Electric Cyan) -->
    <rect x="45" y="45" width="530" height="470" rx="18" fill="none" stroke="#06b6d4" stroke-width="7" filter="url(#neon-cyan)" />
    <rect x="45" y="45" width="530" height="470" rx="18" fill="none" stroke="#ecfeff" stroke-width="2" />

    <!-- Inner Pink Accent Frame Line -->
    <path d="M 65 110 L 65 75 L 140 75" fill="none" stroke="#ec4899" stroke-width="4" filter="url(#neon-pink)" />
    <path d="M 555 110 L 555 75 L 480 75" fill="none" stroke="#ec4899" stroke-width="4" filter="url(#neon-pink)" />
    <path d="M 65 450 L 65 485 L 140 485" fill="none" stroke="#ec4899" stroke-width="4" filter="url(#neon-pink)" />
    <path d="M 555 450 L 555 485 L 480 485" fill="none" stroke="#ec4899" stroke-width="4" filter="url(#neon-pink)" />

    <!-- GENERIC CUSTOM DESIGN SIGN CONTENT -->
    <!-- Stylized Crown / Star / Logo Icon -->
    <g transform="translate(260, 80)" filter="url(#neon-pink)">
      <polygon points="50,15 65,45 98,50 74,74 80,107 50,91 20,107 26,74 2,50 35,45" fill="none" stroke="#ec4899" stroke-width="5" stroke-linejoin="round" />
      <polygon points="50,15 65,45 98,50 74,74 80,107 50,91 20,107 26,74 2,50 35,45" fill="none" stroke="#fff1f2" stroke-width="2" stroke-linejoin="round" />
    </g>

    <!-- Main Text: "CUSTOM NEON" -->
    <g filter="url(#neon-cyan)">
      <text x="310" y="240"
            font-family="'Montserrat', 'Arial Black', sans-serif"
            font-size="44"
            font-weight="900"
            font-style="italic"
            letter-spacing="5"
            text-anchor="middle"
            fill="#06b6d4">
        CUSTOM NEON
      </text>
    </g>
    <text x="310" y="240"
          font-family="'Montserrat', 'Arial Black', sans-serif"
          font-size="44"
          font-weight="900"
          font-style="italic"
          letter-spacing="5"
          text-anchor="middle"
          fill="#f0fdfa">
      CUSTOM NEON
    </text>

    <!-- Sub Header: "& VINYL SIGNS" -->
    <g filter="url(#neon-pink)">
      <text x="310" y="295"
            font-family="'Montserrat', 'Arial Black', sans-serif"
            font-size="34"
            font-weight="900"
            font-style="italic"
            letter-spacing="4"
            text-anchor="middle"
            fill="#ec4899">
        &amp; VINYL SIGNS
      </text>
    </g>
    <text x="310" y="295"
          font-family="'Montserrat', 'Arial Black', sans-serif"
          font-size="34"
          font-weight="900"
          font-style="italic"
          letter-spacing="4"
          text-anchor="middle"
          fill="#fff1f2">
      &amp; VINYL SIGNS
    </text>

    <!-- Divider Bar with Glow -->
    <line x1="120" y1="325" x2="500" y2="325" stroke="#a3e635" stroke-width="4" filter="url(#neon-cyan)" stroke-linecap="round" />

    <!-- "MADE TO YOUR DESIGN" -->
    <text x="310" y="370"
          font-family="'Montserrat', sans-serif"
          font-size="20"
          font-weight="900"
          letter-spacing="4"
          text-anchor="middle"
          fill="#a3e635">
      MADE TO YOUR DESIGN
    </text>

    <!-- Subtitle Spec Bullet Points -->
    <text x="310" y="405"
          font-family="monospace"
          font-size="12"
          font-weight="700"
          letter-spacing="2"
          text-anchor="middle"
          fill="#94a3b8">
      GARAGES • BUSINESSES • ROOMS • BARS
    </text>

    <!-- Generic Spec Badge -->
    <g transform="translate(140, 435)">
      <rect width="340" height="32" rx="8" fill="#11151d" stroke="#252d3a" stroke-width="1.5" />
      <circle cx="24" cy="16" r="4" fill="#06b6d4" />
      <text x="40" y="21" font-family="monospace" font-size="10" font-weight="700" fill="#e2e8f0" letter-spacing="1.5">
        ANY LOGO, SHAPE OR TEXT • 12V LED
      </text>
    </g>
  </g>

  <!-- Tag Pill Top Left -->
  <g transform="translate(50, 45)">
    <rect width="160" height="34" rx="17" fill="#000" stroke="#06b6d4" stroke-width="1.5" opacity="0.95" />
    <circle cx="18" cy="17" r="5" fill="#06b6d4" />
    <text x="34" y="22" font-family="'Montserrat', sans-serif" font-size="11" font-weight="900" fill="#06b6d4" letter-spacing="1.5">VINYL SIGNS</text>
  </g>

  <!-- POA Badge Top Right -->
  <g transform="translate(620, 45)">
    <rect width="130" height="34" rx="17" fill="#000" stroke="#f59e0b" stroke-width="1.5" opacity="0.95" />
    <text x="65" y="22" font-family="'Montserrat', sans-serif" font-size="11" font-weight="900" fill="#f59e0b" text-anchor="middle" letter-spacing="1.5">POA / QUOTE</text>
  </g>

  <!-- Bottom Spec Strip -->
  <g transform="translate(100, 745)">
    <rect width="600" height="28" rx="8" fill="#0e1117" stroke="#1f2633" stroke-width="1" />
    <text x="300" y="18" font-family="monospace" font-size="9.5" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="2">
      BESPOKE ACRYLIC &amp; VINYL SIGNAGE • CUT TO ANY LOGO OR TEXT
    </text>
  </g>
</svg>
