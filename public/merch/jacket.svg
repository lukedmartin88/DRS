<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="100%" height="100%">
  <defs>
    <radialGradient id="jacket-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#181c24" />
      <stop offset="60%" stop-color="#0e1014" />
      <stop offset="100%" stop-color="#060708" />
    </radialGradient>
    <linearGradient id="jacket-shell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232730" />
      <stop offset="35%" stop-color="#15181e" />
      <stop offset="70%" stop-color="#0c0e12" />
      <stop offset="100%" stop-color="#181b22" />
    </linearGradient>
    <linearGradient id="hood-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c323e" />
      <stop offset="50%" stop-color="#161920" />
      <stop offset="100%" stop-color="#090a0d" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#84cc16" flood-opacity="0.6" />
    </filter>
    <filter id="jacket-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Studio Backdrop -->
  <rect width="800" height="900" fill="url(#jacket-bg)" />
  <ellipse cx="400" cy="840" rx="320" ry="70" fill="#84cc16" opacity="0.07" />

  <!-- Jacket Silhouette -->
  <g transform="translate(100, 50)" filter="url(#jacket-shadow)">
    <!-- Hood backdrop -->
    <path d="M 200 40 C 230 10 370 10 400 40 C 440 90 430 140 400 150 C 370 140 230 140 200 150 C 170 140 160 90 200 40 Z" fill="url(#hood-gradient)" />
    
    <!-- Main Body & Sleeves -->
    <path d="M 210 110
             L 120 150
             L 20 280
             C 5 305 30 325 50 310
             L 130 220
             L 130 680
             C 130 705 160 710 200 710
             L 400 710
             C 440 710 470 705 470 680
             L 470 220
             L 550 310
             C 570 325 595 305 580 280
             L 480 150
             L 390 110
             Z"
          fill="url(#jacket-shell)" stroke="#2b313d" stroke-width="1.5" />

    <!-- Technical Seams & Pockets -->
    <!-- Center Front Wind Flap Zip -->
    <line x1="300" y1="120" x2="300" y2="705" stroke="#0a0c0f" stroke-width="6" />
    <line x1="300" y1="120" x2="300" y2="705" stroke="#333a46" stroke-width="2" stroke-dasharray="8,4" />

    <!-- Chest Zipper (Right/Vertical) with Neon Pull -->
    <rect x="235" y="240" width="8" height="120" rx="4" fill="#08090c" />
    <line x1="239" y1="240" x2="239" y2="360" stroke="#1f242d" stroke-width="3" />
    <!-- Neon green puller cord -->
    <circle cx="239" cy="300" r="4" fill="#84cc16" filter="url(#neon-glow)" />
    <rect x="237" y="304" width="4" height="24" rx="2" fill="#84cc16" />

    <!-- Side Hand Pockets with Neon Pulls -->
    <rect x="165" y="470" width="8" height="110" rx="4" fill="#08090c" transform="rotate(-15, 165, 470)" />
    <rect x="175" y="520" width="4" height="22" rx="2" fill="#84cc16" />
    
    <rect x="425" y="470" width="8" height="110" rx="4" fill="#08090c" transform="rotate(15, 425, 470)" />
    <rect x="420" y="520" width="4" height="22" rx="2" fill="#84cc16" />

    <!-- Arm Pocket (Left Sleeve) -->
    <rect x="45" y="250" width="35" height="50" rx="4" fill="#14171d" stroke="#2a303b" stroke-width="1.5" />
    <text x="62" y="278" font-family="Arial, sans-serif" font-size="10" font-weight="900" fill="#a3e635" text-anchor="middle">DRS</text>

    <!-- Chest DRS Logo (Left Chest) -->
    <g transform="translate(325, 235) scale(0.48)">
      <!-- Frame -->
      <path d="M 30 55 L 50 35 L 200 35 L 220 55 L 220 105 L 200 125 L 50 125 L 30 105 Z"
            fill="none" stroke="#84cc16" stroke-width="6" stroke-linejoin="round" />
      <text x="55" y="95" font-family="'Impact', Arial Black, sans-serif" font-size="62" font-style="italic" fill="#a3e635">D</text>
      <text x="100" y="95" font-family="'Impact', Arial Black, sans-serif" font-size="62" font-style="italic" fill="#ec4899">R</text>
      <text x="145" y="95" font-family="'Impact', Arial Black, sans-serif" font-size="62" font-style="italic" fill="#a3e635">S</text>
      <text x="125" y="148" font-family="Arial, sans-serif" font-size="16" font-weight="900" font-style="italic" fill="#84cc16" text-anchor="middle" letter-spacing="2">DAILY RIDE SOUTH</text>
    </g>

    <!-- Hood Drawstrings with Neon Tips -->
    <path d="M 260 130 Q 255 190 250 210" stroke="#111" stroke-width="4" fill="none" />
    <rect x="247" y="210" width="6" height="18" rx="2" fill="#84cc16" filter="url(#neon-glow)" />

    <path d="M 340 130 Q 345 190 350 210" stroke="#111" stroke-width="4" fill="none" />
    <rect x="347" y="210" width="6" height="18" rx="2" fill="#84cc16" filter="url(#neon-glow)" />

    <!-- Adjustable Velcro Cuffs -->
    <rect x="18" y="295" width="38" height="16" rx="3" fill="#111419" stroke="#2b313d" stroke-width="1" />
    <rect x="545" y="295" width="38" height="16" rx="3" fill="#111419" stroke="#2b313d" stroke-width="1" />
  </g>
</svg>
